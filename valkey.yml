version: '3.9'
services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d postgres_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
  scrapper:
    build: ./scrapper
    container_name: scrapper
    depends_on:
      postgres:
        condition: service_healthy
      valkey-cluster-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_MESSAGE_TRANSPORT: http

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password

      SPRING_DATA_REDIS_NODE_1: valkey-1:6379
      SPRING_DATA_REDIS_NODE_2: valkey-2:6379
      SPRING_DATA_REDIS_NODE_3: valkey-3:6379
      APP_STACKOVERFLOW_URL: ${APP_STACKOVERFLOW_URL:-https://api.stackexchange.com}
      STACKOVERFLOW_KEY: ${STACKOVERFLOW_KEY}
      APP_GITHUB_URL: ${APP_GITHUB_URL:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      APP_BOT_URL: ${APP_BOT_URL:-http://bot:8080}
      APP_VALKEY_CHANNEL: links:invalidate

  bot:
    build: ./bot
    container_name: bot
    environment:
      - APP_TELEGRAM_URL=${APP_TELEGRAM_URL:-https://api.telegram.org/bot}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - APP_SCRAPPER_URL=${APP_SCRAPPER_URL:-http://scrapper:8081}
      - APP_MESSAGE_TRANSPORT=http
      - SPRING_KAFKA_LISTENER_AUTO_STARTUP=false
    depends_on:
      - scrapper



  valkey-1:
    image: valkey/valkey:latest
    container_name: valkey-1
    command: >
      valkey-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname valkey-1
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "6379:6379"
      - "16379:16379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey-2:
    image: valkey/valkey:latest
    container_name: valkey-2
    command: >
      valkey-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname valkey-2
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "6380:6379"
      - "16380:16379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey-3:
    image: valkey/valkey:latest
    container_name: valkey-3
    command: >
      valkey-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname valkey-3
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
    ports:
      - "6381:6379"
      - "16381:16379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey-cluster-init:
    image: valkey/valkey:latest
    container_name: valkey-cluster-init
    depends_on:
      valkey-1:
        condition: service_healthy
      valkey-2:
        condition: service_healthy
      valkey-3:
        condition: service_healthy
    command: >
      sh -c "
      valkey-cli --cluster create
      valkey-1:6379
      valkey-2:6379
      valkey-3:6379
      --cluster-replicas 0
      --cluster-yes
      "
