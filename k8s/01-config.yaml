apiVersion: v1
kind: ConfigMap
metadata:
  name: linktracker-config
  namespace: linktracker
data:
  POSTGRES_DB: linktracker
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/linktracker
  APP_SCRAPPER_URL: http://scrapper:8081
  APP_BOT_URL: http://bot:8080
  APP_MESSAGE_TRANSPORT: http
  APP_REPOSITORY_TYPE: jdbc
  APP_GITHUB_URL: https://api.github.com
  APP_STACKOVERFLOW_URL: https://api.stackexchange.com
  APP_TELEGRAM_URL: https://api.telegram.org/bot
  SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
