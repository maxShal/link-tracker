role: Agent

service:
  enabled: false

customConfig:
  data_dir: /vector-data-dir

  sources:
    pods:
      type: kubernetes_logs
      extra_label_selector: "app in (bot,scrapper)"

  transforms:
    application_json:
      type: remap
      inputs: [pods]
      drop_on_abort: true
      source: |
        parsed, err = parse_json(string!(.message))
        if err != null {
          abort
        }
        . = merge!(., parsed)

  sinks:
    victoria:
      type: http
      inputs: [application_json]
      uri: "http://vls-victoria-logs-single-server.linktracker.svc:9428/insert/jsonline?_msg_field=message&_time_field=timestamp"
      encoding:
        codec: json
      framing:
        method: newline_delimited
      healthcheck:
        enabled: false
