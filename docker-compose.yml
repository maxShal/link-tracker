version: '3.9'

services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d postgres_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata

  scrapper:
    build: ./scrapper
    container_name: scrapper
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      APP_VALKEY_CLUSTER_ENABLED: true
      APP_VALKEY_NODES: valkey-1:6379,valkey-2:6379,valkey-3:6379
      SPRING_DATA_REDIS_HOST: valkey
      SPRING_DATA_REDIS_PORT: 6379
      APP_STACKOVERFLOW_URL: ${APP_STACKOVERFLOW_URL:-https://api.stackexchange.com}
      STACKOVERFLOW_KEY: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
      APP_GITHUB_URL: ${APP_GITHUB_URL:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      APP_BOT_URL: ${APP_BOT_URL:-http://bot:8080}

  bot:
    build: ./bot
    container_name: bot
    environment:
      - APP_TELEGRAM_URL=${APP_TELEGRAM_URL:-https://api.telegram.org/bot}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - APP_SCRAPPER_URL=${APP_SCRAPPER_URL:-http://scrapper:8081}
    depends_on:
      - scrapper

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5






