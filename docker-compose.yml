version: '3.9'

services:
  postgres:
    image: postgres:18.6
    container_name: postgres_container
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata

  scrapper:
    build: ./scrapper
    container_name: scrapper
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      ##valkey:
      ##  condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
     ## SPRING_DATA_REDIS_HOST: valkey
      ##SPRING_DATA_REDIS_PORT: 6379
      APP_STACKOVERFLOW_URL: ${APP_STACKOVERFLOW_URL:-https://api.stackexchange.com}
      STACKOVERFLOW_KEY: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
      APP_GITHUB_URL: ${APP_GITHUB_URL:-https://api.github.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      APP_BOT_URL: ${APP_BOT_URL:-http://bot:8080}

  bot:
    build: ./bot
    container_name: bot
    environment:
      - APP_TELEGRAM_URL=${APP_TELEGRAM_URL:-https://api.telegram.org/bot}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - APP_SCRAPPER_URL=${APP_SCRAPPER_URL:-http://scrapper:8081}
    depends_on:
      - scrapper

